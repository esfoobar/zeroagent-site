    - generic [ref=e189]:
      - heading "How ZeroAgent runs the work" [level=2] [ref=e191]
      - list [ref=e192]:
        - listitem [ref=e193]:
          - heading "Point it at your projects folder" [level=3] [ref=e194]
          - paragraph [ref=e195]: Set the root once in settings. ZeroAgent resolves it sensibly even if you don't, and the file explorer, memory and state all live under that one folder.
        - listitem [ref=e196]:
          - heading "Describe the work in a sentence" [level=3] [ref=e197]
          - paragraph [ref=e198]: Tell Zero Agent what you want in plain words. It breaks the work into tickets and dispatches workers. The app picks an enabled model for each task, using what it has learned about quality and cost.
        - listitem [ref=e199]:
          - heading "Workers open their own pull requests" [level=3] [ref=e200]
          - paragraph [ref=e201]: A worker's job isn't done at "here's a diff." It follows your workspace conventions through tests, a pull request and a closed ticket, then its worktree is retired.
    - generic [ref=e203]:
      - heading "What ZeroAgent is not" [level=2] [ref=e205]
      - list [ref=e206]:
        - listitem [ref=e207]: Not an IDE. Keep your editor.
        - listitem [ref=e208]: Not a terminal with more panes in it.
        - listitem [ref=e209]: Not five agents you have to babysit yourself.
        - listitem [ref=e210]: Not a kanban board.
        - listitem [ref=e211]: Not cloud compute. Workers run on your computer and use your model providers.
    - generic [ref=e213]:
      - heading "Requirements" [level=2] [ref=e215]
      - paragraph [ref=e217]:
        - text: macOS 14 or later, Apple Silicon or Intel.
        - strong [ref=e218]: "Prerequisite:"
        - text: ZeroAgent coordinates the work; it drives a coding agent CLI already installed on your computer to do it. Zero Agent itself needs one of Claude Code, Codex or Gemini set up on your computer; you do not need a Claude account if you use Codex or Gemini. Workers can also use open models through OpenRouter with your own key.
    - generic [ref=e220]:
      - heading "Download ZeroAgent for Mac or Linux beta" [level=2] [ref=e221]
      - link "Choose your download" [ref=e223] [cursor=pointer]:
        - /url: /download
      - paragraph [ref=e224]: Free, local, and yours to keep. Linux beta supports Ubuntu 24.04 x64. Zero Agent runs on Claude, Codex or Gemini; you need any one of them.
      - paragraph [ref=e225]: Free for local work on your own computer, with no account. Remote monitoring and the phone companion are Premium, $5 a month; cloud workspaces are coming later as Platinum.
