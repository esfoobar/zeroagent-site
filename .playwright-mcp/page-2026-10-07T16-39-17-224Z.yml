    - generic [ref=e171]:
      - generic [ref=e172]:
        - heading "Watch your workers from your phone" [level=2] [ref=e173]
        - paragraph [ref=e174]: "ZeroAgent Premium pairs a native iOS companion with your Mac by scanning a QR code. It's a viewer and a nudger, not a second orchestrator: glance at the canvas, open a worker's transcript, answer a question it's waiting on, or send it a message from wherever you are. The work still runs on your own Mac; the phone only watches and steers it, with push notifications when Zero Agent needs your attention."
        - paragraph [ref=e175]: Part of Premium, $5 a month. Requires a paired Mac connected to the relay.
