  - main [ref=e21]:
    - generic [ref=e23]:
      - generic [ref=e24]: Free local app · Claude, Codex or Gemini
      - heading "One agent to direct. More done each day." [level=1] [ref=e27]
      - paragraph [ref=e28]: "Zero Agent is your AI VP of Engineering, and it runs on Claude, Codex or Gemini with your own account: use the one you already have. Describe the work once; it writes the tickets, spawns workers, picks the model that earns its price, and tells you when it's done. You review the result, not the process."
      - generic [ref=e29]:
        - link "Download" [ref=e30] [cursor=pointer]:
          - /url: /download
        - link "See how it works" [ref=e31] [cursor=pointer]:
          - /url: "#coordinator"
      - paragraph [ref=e32]:
        - text: or
        - button "brew trust zeroagentdev/tap brew install --cask zeroagentdev/tap/zeroagent" [ref=e33] [cursor=pointer]
      - paragraph [ref=e34]: Homebrew 6 or newer needs that trust line before it will load the cask; older Homebrew can skip straight to installing.
      - paragraph [ref=e35]: macOS 14 or later, Apple Silicon or Intel. Zero Agent needs Claude Code, Codex or Gemini set up; any one of them will do.
      - paragraph [ref=e36]: Mac, Linux and Windows beta.
      - generic "The ZeroAgent canvas dispatching several worker creatures, each with a task tag and repo badge, spreading across a dark canvas while one runs a background script shown as a spinning gear with an elapsed-time readout." [ref=e39]
    - generic [ref=e42]:
      - generic [ref=e43]:
        - heading "One workbench per stream of work" [level=2] [ref=e44]
        - paragraph [ref=e45]: "A workbench is a tab at the top of the window. It holds one conversation with Zero Agent and everything that conversation deploys: workers, tasks, watches, tracked jobs, reports and pages. Open a new tab for each stream of work, an epic, a client, a side project, and its Zero Agent only ever knows that one stream. Nothing from one project bleeds into another, and switching tabs switches the whole context with it. Every workbench draws from the same worker roster, and a paired phone can open any of them. Run this website in one tab and a separate app in another."
      - img "The ZeroAgent tab strip with four workbenches open, each its own Zero Agent conversation, with the active one boxed." [ref=e47]
    - generic [ref=e50]:
      - generic [ref=e51]:
        - heading "See your workers at a glance" [level=2] [ref=e52]
        - paragraph [ref=e53]: "Workers are not rows in a table. They are creatures on a 2D canvas: colour and motion tell you what's happening without reading anything, so you can watch several agents at once without losing track of any of them, and a click opens the transcript."
      - img "A hovered worker on the canvas showing its task title, the model it's running, the command in progress, elapsed time and its branch name, with no click required." [ref=e55]
    - generic [ref=e57]:
      - generic [ref=e58]:
        - heading "What you get, free and local" [level=2] [ref=e59]
        - paragraph [ref=e60]: The local app is free and needs no ZeroAgent account. Model usage is paid through your own provider accounts or keys.
      - generic [ref=e61]:
        - generic [ref=e62]:
          - heading "It keeps checking so you do not have to" [level=3] [ref=e63]
          - paragraph [ref=e64]: The lead sets itself reminders that fire on their own, tracks background work it can't watch like a CI run or a reply from another machine, and raises one task with one question when work goes quiet, instead of paging you for every worker that finishes.
        - generic [ref=e65]:
          - heading "Model selection that learns from the work" [level=3] [ref=e66]
          - paragraph [ref=e67]: Zero Agent keeps a score for each model, updated from verdicts and ratings on finished work. Newly enabled models get tried until they have a score. Automatic routing keeps frontier models off routine coding.
        - generic [ref=e68]:
          - heading "Per worker cost tracking" [level=3] [ref=e69]
          - paragraph [ref=e70]: See each worker's token usage and cost when its agent reports them. Estimates are marked, and missing usage stays unknown. Your provider account shows the actual bill.
        - generic [ref=e71]:
          - heading "It remembers what you told it, between sessions" [level=3] [ref=e72]
          - paragraph [ref=e73]: A local, self-cleaning memory means a coding agent that remembers across sessions, so you don't re-explain your preferences and context every time you open the app.
        - generic [ref=e74]:
          - heading "Context tracking, with a handoff for long sessions" [level=3] [ref=e75]
          - paragraph [ref=e76]: The app shows context usage where the agent reports it. When Zero Agent's context fills up, it writes a handoff note and starts a fresh conversation with the worker roster intact.
        - generic [ref=e77]:
          - heading "It interrupts you only when you have to decide" [level=3] [ref=e78]
          - paragraph [ref=e79]: Zero Agent raises a macOS notification when it needs your attention or ends its turn waiting for your answer. Routine worker completions go back to Zero Agent.
        - generic [ref=e80]:
          - heading "A task list grouped by what it serves" [level=3] [ref=e81]
          - paragraph [ref=e82]: Workers are grouped under the piece of work they serve, with a title a person would actually use instead of an internal ticket id.
        - generic [ref=e83]:
          - heading "Read only agents for questions and surveys" [level=3] [ref=e84]
          - paragraph [ref=e85]: Dispatch a worker instructed to read and report, for a question or a survey that needs no code changes.
        - generic [ref=e86]:
          - heading "Parallel workers, one git worktree each" [level=3] [ref=e87]
          - paragraph [ref=e88]: Each coding worker gets its own git worktree and branch, keeping parallel changes separate until they are ready to merge. Its work lands as a pull request under your conventions before the worktree retires.
    - generic [ref=e90]:
      - generic [ref=e91]:
        - heading "Choose your main agent" [level=2] [ref=e92]
        - paragraph [ref=e93]: "The main agent is Zero Agent: the one you talk to, which plans the work and dispatches the workers. It runs on Claude, Codex or Gemini, so you can run the whole app on an account you already have. Available from ZeroAgent 0.22.0."
      - generic [ref=e94]:
        - generic [ref=e95]:
          - heading "Claude" [level=3] [ref=e96]
          - paragraph [ref=e97]: Needs Claude Code installed and signed in to your own Claude account.
        - generic [ref=e98]:
          - heading "Codex" [level=3] [ref=e99]
          - paragraph [ref=e100]: Signed in with your ChatGPT account, or with your own OpenAI API key.
        - generic [ref=e101]:
          - heading "Gemini" [level=3] [ref=e102]
          - paragraph [ref=e103]: Needs the Gemini CLI and your own Gemini API key. Google account sign-in no longer works for personal accounts. Gemini does not report context use, so the meter reads unknown and long sessions hand off by turn count and time.
      - paragraph [ref=e105]: The first time you open ZeroAgent it checks which of the three are installed and signed in, and asks you to choose. You can reopen that choice any time in Settings. Whichever one leads, workers can still be any model you have switched on, across Claude, Codex, Gemini and open models through OpenRouter.
    - generic [ref=e108]:
      - generic [ref=e109]:
        - heading "Your subscriptions, your keys" [level=2] [ref=e110]
        - paragraph [ref=e111]: "Run Zero Agent on the account you have, then switch on the models you want to use across Claude, Codex, Gemini and open models through OpenRouter. No one provider leads: whichever you chose as your main agent, ZeroAgent selects from that pool for each task. It compares quality against published input and output prices per million tokens, even for models on a subscription. A subscription never counts as free usage in that comparison. ZeroAgent adds no markup to your model calls."
      - generic [ref=e112]:
        - generic [ref=e115]:
          - heading "Claude, via Claude Code" [level=3] [ref=e116]
          - paragraph [ref=e117]: Your own Claude account. Main agent or worker.
        - generic [ref=e120]:
          - heading "Codex" [level=3] [ref=e121]
          - paragraph [ref=e122]: Your ChatGPT account or OpenAI key. Main agent or worker.
        - generic [ref=e125]:
          - heading "Gemini" [level=3] [ref=e126]
          - paragraph [ref=e127]: Your own Gemini API key. Main agent or worker.
        - generic [ref=e130]:
          - heading "Open models, via OpenRouter" [level=3] [ref=e131]
          - paragraph [ref=e132]: Your own OpenRouter key. Workers.
