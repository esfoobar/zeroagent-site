<!DOCTYPE html>
<html dir="ltr" lang="en-US">
<head>

	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex, nofollow" />
	<meta name="theme-color" content="#000000" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/static/css/zeroagent.css" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
	<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
	<link rel="manifest" href="/site.webmanifest" />

	<title>ZeroAgent - Account</title>

</head>

<body>

	<header class="za-nav">
		<div class="za-container za-nav-inner">
			<a href="/" class="za-brand" aria-label="ZeroAgent home">
				<svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
					<rect x="3" y="6" width="18" height="15" rx="5" fill="#E8785C"/>
					<circle cx="9" cy="13.5" r="1.7" fill="#000"/>
					<circle cx="15" cy="13.5" r="1.7" fill="#000"/>
					<rect x="11.1" y="2" width="1.8" height="4" rx="0.9" fill="#E8785C"/>
				</svg>
				<span>ZeroAgent</span>
			</a>
			<ul class="za-nav-links">
				<li><a href="/download">Download</a></li>
			</ul>
			<a href="/download" class="za-btn za-btn--primary za-btn--small za-nav-cta">Download</a>
		</div>
	</header>

	<main>

		<div class="za-container za-page-head">
			<h1>Account</h1>
			<p id="za-account-status">Checking your sign-in.</p>
		</div>

		<div class="za-container">
			<div class="za-prose">
				<p id="za-account-error" hidden></p>
				<p>
					<a id="za-account-signin" class="za-btn za-btn--primary" href="/api/auth/github/start?return=/account" hidden>Sign in with GitHub</a>
					<button id="za-account-signout" class="za-btn" type="button" hidden>Sign out</button>
				</p>
			</div>
		</div>

	</main>

	<footer class="za-footer za-footer--simple">
		<div class="za-container">
			<div class="za-footer-copy">Copyrights &copy; 2026 All Rights Reserved by MVPLean.</div>
		</div>
	</footer>

	<script src="/static/js/zeroagent-account.js"></script>

</body>
</html>
